plugins {
    id 'com.android.application'
}

// Run a git command at configuration time and return its trimmed output
// (empty if the command fails, e.g. when there are no tags)
def git(String... args) {
    return providers.exec {
        commandLine(['git'] + args.toList())
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
}

// Function to get version info from git tags
def getVersionFromGit() {
    // Get the latest tag
    def latestTag = git('describe', '--tags', '--abbrev=0')

    if (latestTag.isEmpty()) {
        // No tags found, use default values
        return [versionName: "1.0.0", versionCode: 1]
    }

    // Remove 'v' prefix if present
    def versionName = latestTag.startsWith('v') ? latestTag.substring(1) : latestTag

    // Get commit count since the tag for version code
    def commitCount = git('rev-list', '--count', latestTag + '..HEAD')
    def baseVersionCode = 1

    // Parse version components for a more meaningful version code
    def versionParts = versionName.split('\\.')
    if (versionParts.length >= 3) {
        def major = versionParts[0].toInteger()
        def minor = versionParts[1].toInteger()
        def patch = versionParts[2].toInteger()
        baseVersionCode = major * 10000 + minor * 100 + patch
    }

    def versionCode = baseVersionCode + (commitCount.isEmpty() ? 0 : commitCount.toInteger())

    return [versionName: versionName, versionCode: versionCode]
}

// Alternative function that works better in CI/CD environments
def getVersionFromGitCI() {
    // GITHUB_REF_NAME is only a version on tag builds; on PRs it's e.g. "27/merge"
    def tagRefName = System.getenv('GITHUB_REF_TYPE') == 'tag' ? System.getenv('GITHUB_REF_NAME') : null
    def versionName = tagRefName ?: System.getenv('TAG_NAME')

    if (versionName && versionName.startsWith('v')) {
        versionName = versionName.substring(1)
    }

    if (!versionName) {
        // Fallback to git describe
        def latestTag = git('describe', '--tags', '--abbrev=0')
        if (latestTag.startsWith('v')) {
            versionName = latestTag.substring(1)
        } else if (!latestTag.isEmpty()) {
            versionName = latestTag
        } else {
            versionName = "1.0.0"
        }
    }

    // Calculate version code
    def versionParts = versionName.split('\\.')
    def baseVersionCode = 1

    if (versionParts.length >= 3) {
        def major = versionParts[0].toInteger()
        def minor = versionParts[1].toInteger()
        def patch = versionParts[2].toInteger()
        baseVersionCode = major * 10000 + minor * 100 + patch
    }

    // In CI, we're building the exact tag, so no commit count
    def versionCode = baseVersionCode

    return [versionName: versionName, versionCode: versionCode]
}

// Use CI version if in CI environment, otherwise use local git version
def versionInfo = System.getenv('CI') ? getVersionFromGitCI() : getVersionFromGit()

android {
    namespace = 'com.harringa.mytime'
    compileSdk = 36

    defaultConfig {
        minSdk = 26
        targetSdk = 36
        versionCode = versionInfo.versionCode
        versionName = versionInfo.versionName
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            // Play App Signing - only need upload key
            def uploadKeystore = System.getenv("UPLOAD_KEYSTORE")
            def uploadPassword = System.getenv("UPLOAD_KEY_PASSWORD")
            def uploadAlias = System.getenv("UPLOAD_KEY_ALIAS")
            storeFile = file(uploadKeystore ? uploadKeystore : '../upload-keystore.jks')
            storePassword = uploadPassword
            keyAlias = uploadAlias
            keyPassword = uploadPassword
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            signingConfig = signingConfigs.release
        }
        debug {
            minifyEnabled = false
            debuggable = true
            // JaCoCo report for unit tests: createDebugUnitTestCoverageReport
            enableUnitTestCoverage = true
        }
    }
    testOptions {
        unitTests {
            // Robolectric needs merged resources to inflate layouts
            includeAndroidResources = true
        }
    }
    packaging {
        resources {
            // AGP adds kotlin-stdlib, but the app has no Kotlin code; R8 strips the classes,
            // this drops the builtins metadata it would otherwise ship
            excludes += 'kotlin/**'
        }
    }
}

// Robolectric only runs the Android 16 (SDK 36) framework on Java 21+; the build itself
// (and the app's bytecode level) stays on Java 17
tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    // Robolectric's FileDescriptor shadow reads JDK internals that Java 17+ doesn't export
    jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
}

// enableUnitTestCoverage makes AGP apply the jacoco plugin, which adds its extension to test
// tasks. Robolectric loads app classes through its own class loader (no code source location),
// and JaCoCo skips those unless told otherwise, reporting 0% for the app module.
pluginManager.withPlugin('jacoco') {
    tasks.withType(Test).configureEach {
        def coverage = extensions.getByType(JacocoTaskExtension)
        coverage.includeNoLocationClasses = true
        coverage.excludes = ['jdk.internal.*']
    }
}

// Set the base name for archives to include version
base {
    archivesName = "mytime-${versionInfo.versionName}"
}

dependencies {
    // Guava for immutable collections and utilities
    implementation 'com.google.guava:guava:33.7.1-android'

    // RecyclerView - not used (using ListView instead for minimal method count)
    // implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Material Design - not used (using basic widgets for minimal method count)
    // implementation 'com.google.android.material:material:1.11.0'

    implementation project(':libraries:timecalc')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
}

// Task to display current version information
tasks.register('showVersion') {
    group = 'versioning'
    description = 'Display current version information'

    // Resolve everything while configuring, so the action doesn't touch the project
    def targetSdk = android.defaultConfig.targetSdk
    def minSdk = android.defaultConfig.minSdk
    def javaVersion = android.compileOptions.sourceCompatibility
    def buildType = project.findProperty('buildType') ?: 'debug'
    def gitDescribe = git('describe', '--tags', '--always')

    doLast {
        println "Current Version Information:"
        println "  Version Name: ${versionInfo.versionName}"
        println "  Version Code: ${versionInfo.versionCode}"
        println "  Target SDK: ${targetSdk}"
        println "  Min SDK: ${minSdk}"
        println "  Java Version: ${javaVersion}"
        println "  Build Type: ${buildType}"
        println "  CI Environment: ${System.getenv('CI') ? 'Yes' : 'No'}"

        // Show git information if available
        if (!gitDescribe.isEmpty()) {
            println "  Git Describe: ${gitDescribe}"
        }
    }
}

// Task to output version info in a format suitable for CI/CD
tasks.register('outputVersionInfo') {
    group = 'versioning'
    description = 'Output version information in a format suitable for CI/CD'

    def targetSdk = android.defaultConfig.targetSdk
    def minSdk = android.defaultConfig.minSdk
    def javaVersion = android.compileOptions.sourceCompatibility

    doLast {
        println "VERSION_NAME=${versionInfo.versionName}"
        println "VERSION_CODE=${versionInfo.versionCode}"
        println "TARGET_SDK=${targetSdk}"
        println "MIN_SDK=${minSdk}"
        println "JAVA_VERSION=${javaVersion}"
    }
}
