name: Create Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.1.0

# contents: write creates the GitHub Release; pull-requests: read lets
# play-release-notes.py read each PR's `## Release note`; id-token: write mints
# the GitHub OIDC token that Workload Identity Federation trades for a
# short-lived Google Play token (no service-account key exists anywhere).
permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0  # full history and tags, so release notes can diff against the previous tag

    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        
    - name: Cache Gradle packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Decode upload keystore
      run: echo ${{ secrets.UPLOAD_KEYSTORE }} | base64 -d > upload-keystore.jks
      env:
        UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}

    - name: Build signed release App Bundle
      run: ./gradlew bundleRelease
      env:
        UPLOAD_KEYSTORE: ../upload-keystore.jks
        UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}

    # Before the GitHub Release, so notes over Play's 500-character limit stop
    # the run before anything is published.
    - name: Collect Google Play release notes
      run: python3 scripts/play-release-notes.py collect "$GITHUB_REF_NAME" > play-notes.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Release Notes
      id: release_notes
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

        if [ -n "$PREVIOUS_TAG" ]; then
          # Generate changelog from commits since previous tag
          CHANGELOG=$(git log --pretty=format:"- %s" ${PREVIOUS_TAG}..HEAD | grep -v "Merge pull request" | grep -v "Merge branch" | head -20 || true)
        else
          # If no previous tag, show recent commits
          CHANGELOG=$(git log --no-merges --pretty=format:"- %s" -10)
        fi

        # Get version info from Gradle (single source of truth)
        VERSION_OUTPUT=$(./gradlew outputVersionInfo --quiet)
        if [ $? -ne 0 ]; then
          echo "Error: Failed to retrieve version information from Gradle." >&2
          exit 1
        fi
        VERSION_NAME=$(echo "$VERSION_OUTPUT" | grep "VERSION_NAME=" | sed 's/VERSION_NAME=//')
        VERSION_CODE=$(echo "$VERSION_OUTPUT" | grep "VERSION_CODE=" | sed 's/VERSION_CODE=//')
        TARGET_SDK=$(echo "$VERSION_OUTPUT" | grep "TARGET_SDK=" | sed 's/TARGET_SDK=//')
        MIN_SDK=$(echo "$VERSION_OUTPUT" | grep "MIN_SDK=" | sed 's/MIN_SDK=//')
        JAVA_VERSION=$(echo "$VERSION_OUTPUT" | grep "JAVA_VERSION=" | sed 's/JAVA_VERSION=//')
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        PLAY_NOTES=$(cat play-notes.txt)

        # Create release body
        cat << EOF > release_notes.md
        ## Release ${{ github.ref_name }}

        ### Google Play "What's new"
        $PLAY_NOTES

        ### Changes
        $CHANGELOG

        ### Installation
        Once Google Play publishing is set up (README), the App Bundle (.aab) below is also uploaded to the Play production track as a draft: send it for review in the Play Console.

        ### Build Info
        - Version: $VERSION_NAME ($VERSION_CODE)
        - Target SDK: $TARGET_SDK
        - Min SDK: $MIN_SDK
        - Java Version: $JAVA_VERSION
        EOF
        
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      with:
        files: |
          mytime/build/outputs/bundle/release/mytime-*.aab
        body: ${{ steps.release_notes.outputs.notes }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Set up once (see README "Google Play publishing"): until both variables
    # exist the upload is skipped, so tagging keeps working, but loudly.
    - name: Check Google Play configuration
      id: play
      env:
        PLAY_WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
        PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
      run: |
        if [ -n "$PLAY_WIF_PROVIDER" ] && [ -n "$PLAY_SERVICE_ACCOUNT" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::PLAY_WIF_PROVIDER / PLAY_SERVICE_ACCOUNT are not set: the bundle was NOT uploaded to Google Play. Upload the .aab from the GitHub Release by hand."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Authenticate to Google Play
      if: steps.play.outputs.enabled == 'true'
      id: gcp
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
        service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        token_format: access_token
        access_token_scopes: https://www.googleapis.com/auth/androidpublisher
        create_credentials_file: false

    - name: Upload to Google Play (production, draft)
      if: steps.play.outputs.enabled == 'true'
      env:
        PLAY_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        VERSION_NAME: ${{ steps.release_notes.outputs.version_name }}
        PLAY_NOTES_LANGUAGE: ${{ vars.PLAY_NOTES_LANGUAGE || 'en-US' }}
      run: |
        set -- mytime/build/outputs/bundle/release/mytime-*.aab
        [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::expected exactly one bundle, found: $*"; exit 1; }
        python3 scripts/play-publish.py \
          --package com.harringa.mytime \
          --aab "$1" \
          --mapping mytime/build/outputs/mapping/release/mapping.txt \
          --version-name "$VERSION_NAME" \
          --notes-file play-notes.txt \
          --language "$PLAY_NOTES_LANGUAGE" \
          --track production \
          --status draft
