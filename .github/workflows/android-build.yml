name: Android Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        
    - name: Cache Gradle packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build with Gradle
      run: ./gradlew build -x assembleRelease
      
    - name: Run tests
      run: ./gradlew test

    - name: Check version numbering
      run: ./scripts/check-version-info.sh

    - name: Generate coverage reports
      run: ./gradlew :mytime:createDebugUnitTestCoverageReport :libraries:timecalc:jacocoTestReport

    - name: Summarize coverage
      run: |
        ./scripts/coverage-summary.py \
          mytime=mytime/build/reports/coverage/test/debug/report.xml \
          timecalc=libraries/timecalc/build/reports/jacoco/test/jacocoTestReport.xml \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-reports
        path: |
          mytime/build/reports/coverage/test/debug/
          libraries/timecalc/build/reports/jacoco/test/
      
    - name: Build debug APK
      run: ./gradlew assembleDebug
      
    - name: Upload debug APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: app-debug
        path: mytime/build/outputs/apk/debug/
        
    - name: Run lint checks
      run: ./gradlew lint
