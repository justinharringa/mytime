name: Android Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        
    - name: Cache Gradle packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build with Gradle
      run: ./gradlew build -x assembleRelease
      
    - name: Run tests
      run: ./gradlew test

    - name: Check version numbering
      run: ./scripts/check-version-info.sh

    - name: Generate coverage reports
      run: ./gradlew :mytime:createDebugUnitTestCoverageReport :libraries:timecalc:jacocoTestReport

    - name: Summarize coverage
      run: |
        ./scripts/coverage-summary.py \
          mytime=mytime/build/reports/coverage/test/debug/report.xml \
          timecalc=libraries/timecalc/build/reports/jacoco/test/jacocoTestReport.xml \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: coverage-reports
        path: |
          mytime/build/reports/coverage/test/debug/
          libraries/timecalc/build/reports/jacoco/test/
      
    - name: Build debug APK
      run: ./gradlew assembleDebug
      
    - name: Upload debug APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: app-debug
        path: mytime/build/outputs/apk/debug/
        
    - name: Run lint checks
      run: ./gradlew lint
