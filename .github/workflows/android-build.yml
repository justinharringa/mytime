name: Android Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/jdks
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build with Gradle
      run: ./gradlew build -x assembleRelease
      
    - name: Run tests
      run: ./gradlew test

    - name: Check version numbering
      run: ./scripts/check-version-info.sh

    - name: Generate coverage reports
      run: ./gradlew :mytime:createDebugUnitTestCoverageReport :libraries:timecalc:jacocoTestReport

    - name: Summarize coverage
      run: |
        ./scripts/coverage-summary.py \
          mytime=mytime/build/reports/coverage/test/debug/report.xml \
          timecalc=libraries/timecalc/build/reports/jacoco/test/jacocoTestReport.xml \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          mytime/build/reports/coverage/test/debug/
          libraries/timecalc/build/reports/jacoco/test/
      
    - name: Build debug APK
      run: ./gradlew assembleDebug
      
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: mytime/build/outputs/apk/debug/
        
    - name: Run lint checks
      run: ./gradlew lint
